name: Scan Cobephim stream
on:
  workflow_dispatch:
    inputs:
      url:
        description: Cobephim episode URL
        required: false
        default: https://cobephim.ws/phim/de-che-dai-han/tap-770232
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Scan network
        run: npm run scan -- "${{ inputs.url }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobephim-scan-result
          path: scan-result.json
